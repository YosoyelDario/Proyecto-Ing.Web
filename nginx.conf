server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la SPA: cualquier path que no sea un archivo físico
    # se redirige a index.html para que React Router lo maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de caché para assets con hash en el nombre (generados por Vite)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin caché para index.html (para que siempre cargue la versión más reciente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}